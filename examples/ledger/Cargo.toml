[package]
name = "veylor-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
parking_lot.workspace = true
ctrlc = { version = "3", features = ["termination"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylor-server = { version = "0.1.0", path = "../../crates/veylor-server" }
veylor-web = { version = "0.1.0", path = "../../crates/veylor-web" }

[dev-dependencies]
veylor-tls = { version = "0.1.0", path = "../../crates/veylor-tls" }

[lints]
workspace = true
