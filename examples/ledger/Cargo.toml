[package]
name = "veylor-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylor-runtime = { version = "0.1.0", path = "../../crates/veylor-runtime" }
veylor-server = { version = "0.1.0", path = "../../crates/veylor-server" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[lints]
workspace = true
