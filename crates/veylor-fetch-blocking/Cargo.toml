[package]
name = "veylor-fetch-blocking"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dependencies]
base64 = "0.22"
parking_lot = { workspace = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
veylor-client = { version = "0.1.0", path = "../veylor-client" }
veylor-tls = { version = "0.1.0", path = "../veylor-tls" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylor-server = { version = "0.1.0", path = "../veylor-server" }

[lints]
workspace = true
