[package]
name = "veylor-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
veylor-router = { version = "0.1.0", path = "../veylor-router" }
veylor-runtime = { version = "0.1.0", path = "../veylor-runtime" }
veylor-server = { version = "0.1.0", path = "../veylor-server" }

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[dependencies.serde]
version = "1"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[lints]
workspace = true
