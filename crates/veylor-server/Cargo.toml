[package]
name = "veylor-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
veylor-runtime = { version = "0.1.0", path = "../veylor-runtime" }
veylor-router = { version = "0.1.0", path = "../veylor-router" }
veylor-http1 = { version = "0.1.0", path = "../veylor-http1" }
veylor-h3 = { version = "0.1.0", path = "../veylor-h3" }
veylor-http2 = { version = "0.1.0", path = "../veylor-http2" }
veylor-tls = { version = "0.1.0", path = "../veylor-tls" }
veylor-websocket = { version = "0.1.0", path = "../veylor-websocket" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs"] }

[lints]
workspace = true
