[package]
name = "veylor-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
veylor-client = { version = "0.1.0", path = "../veylor-client" }
veylor-http1 = { version = "0.1.0", path = "../veylor-http1" }
veylor-http2 = { version = "0.1.0", path = "../veylor-http2" }
veylor-runtime = { version = "0.1.0", path = "../veylor-runtime" }
veylor-server = { version = "0.1.0", path = "../veylor-server" }
veylor-server-conn = { version = "0.1.0", path = "../veylor-server-conn" }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
