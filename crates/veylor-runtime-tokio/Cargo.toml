[package]
name = "veylor-runtime-tokio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "macros"] }
veylor-client = { version = "0.1.0", path = "../veylor-client" }
veylor-http1 = { version = "0.1.0", path = "../veylor-http1" }
veylor-server-conn = { version = "0.1.0", path = "../veylor-server-conn" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
