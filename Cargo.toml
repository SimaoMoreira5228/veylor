[workspace]
resolver = "3"
members = ["crates/veylor-http1", "crates/veylor-router"]
default-members = ["crates/veylor-http1", "crates/veylor-router"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
