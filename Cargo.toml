[workspace]
resolver = "3"
members = [
    "crates/veylor-client",
    "crates/veylor-ffi",
    "crates/veylor-http1",
    "crates/veylor-http2",
    "crates/veylor-router",
    "crates/veylor-runtime",
    "crates/veylor-server",
    "crates/veylor-server-conn",
    "crates/veylor-tls",
]
default-members = [
    "crates/veylor-client",
    "crates/veylor-ffi",
    "crates/veylor-http1",
    "crates/veylor-http2",
    "crates/veylor-router",
    "crates/veylor-runtime",
    "crates/veylor-server",
    "crates/veylor-server-conn",
    "crates/veylor-tls",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
